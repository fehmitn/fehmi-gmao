{% extends "base.html" %}
{% import "partials/macros.html" as ui %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header">Emplacements de {{ site.code }} — {{ site.name }}</div>
      <div class="card-body">
        {% if tree %}
        {{ ui.render_tree(tree) }}
        {% else %}
        <p class="text-muted mb-0">Aucun emplacement dans cette usine.</p>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card mb-4">
      <div class="card-header">Nouvel emplacement</div>
      <div class="card-body">
        <form method="post" action="/locations">
          <input type="hidden" name="site_id" value="{{ site.id }}">
          <div class="row g-2">
            <div class="col-md-3">
              <label class="form-label" for="loc-code">Code</label>
              <input class="form-control" id="loc-code" name="code" required>
            </div>
            <div class="col-md-5">
              <label class="form-label" for="loc-name">Nom</label>
              <input class="form-control" id="loc-name" name="name" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="loc-type">Type</label>
              <select class="form-select" id="loc-type" name="location_type_id" required>
                {% for type in location_types %}
                <option value="{{ type.id }}">{{ type.label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="loc-parent">Emplacement parent</label>
              <select class="form-select" id="loc-parent" name="parent_id">
                <option value="">— racine de l'usine —</option>
                {% for node in tree %}
                <option value="{{ node.id }}">{{ node.code }} — {{ node.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="loc-desc">Description</label>
              <input class="form-control" id="loc-desc" name="description">
            </div>
          </div>
          <button class="btn btn-primary mt-3" type="submit">Créer l'emplacement</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Fiche usine</div>
      <div class="card-body">
        <form method="post" action="/sites/{{ site.id }}/update" class="row g-2">
          <div class="col-md-3">
            <label class="form-label" for="edit-code">Code</label>
            <input class="form-control" id="edit-code" name="code" value="{{ site.code }}">
          </div>
          <div class="col-md-5">
            <label class="form-label" for="edit-name">Nom</label>
            <input class="form-control" id="edit-name" name="name" value="{{ site.name }}">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="edit-city">Ville</label>
            <input class="form-control" id="edit-city" name="city" value="{{ site.city or '' }}">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="edit-address">Adresse</label>
            <input class="form-control" id="edit-address" name="address" value="{{ site.address or '' }}">
          </div>
          <div class="col-md-2">
            <label class="form-label" for="edit-country">Pays</label>
            <input class="form-control" id="edit-country" name="country" value="{{ site.country or '' }}">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="edit-active" name="is_active" value="1"
                     {% if site.is_active %}checked{% endif %}>
              <label class="form-check-label" for="edit-active">Active</label>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-outline-primary" type="submit">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
