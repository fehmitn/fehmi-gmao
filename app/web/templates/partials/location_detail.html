<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>{{ location.code }} — {{ location.name }}</span>
    <span class="badge text-bg-light border">{{ location.location_type.label }}</span>
  </div>
  <div class="card-body">
    <p class="small text-muted mb-3">Chemin : <code>{{ location.path }}</code> — profondeur {{ location.depth }}</p>

    <form method="post" action="/locations/{{ location.id }}/update" class="row g-2 mb-4">
      <div class="col-md-4">
        <label class="form-label" for="det-code">Code</label>
        <input class="form-control" id="det-code" name="code" value="{{ location.code }}">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="det-name">Nom</label>
        <input class="form-control" id="det-name" name="name" value="{{ location.name }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="det-type">Type</label>
        <select class="form-select" id="det-type" name="location_type_id">
          {% for type in location_types %}
          <option value="{{ type.id }}" {% if type.id == location.location_type_id %}selected{% endif %}>
            {{ type.label }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="det-parent">Parent</label>
        <select class="form-select" id="det-parent" name="parent_id">
          <option value="">— racine de l'usine —</option>
          {% for candidate in parent_candidates %}
          <option value="{{ candidate.id }}" {% if candidate.id == location.parent_id %}selected{% endif %}>
            {{ candidate.code }} — {{ candidate.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label" for="det-desc">Description</label>
        <input class="form-control" id="det-desc" name="description" value="{{ location.description or '' }}">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="det-active" name="is_active" value="1"
                 {% if location.is_active %}checked{% endif %}>
          <label class="form-check-label" for="det-active">Actif</label>
        </div>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-outline-primary btn-sm" type="submit">Enregistrer</button>
        <button class="btn btn-outline-secondary btn-sm" type="submit" formaction="/locations/{{ location.id }}/move">
          Déplacer
        </button>
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center">
      <div class="small text-muted">
        {{ location.equipment_count }} équipement(s) actuellement implanté(s)
        — {{ location.child_count }} sous-emplacement(s)
      </div>
      <form method="post" action="/locations/{{ location.id }}/delete"
            onsubmit="return confirm('Supprimer cet emplacement ?');">
        <button class="btn btn-outline-danger btn-sm" type="submit">Supprimer</button>
      </form>
    </div>
  </div>
</div>
